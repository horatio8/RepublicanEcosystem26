version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    env_file: backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: Standalone scraper that runs on a schedule
  scraper:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    env_file: backend/.env
    command: >
      python -c "
      import asyncio
      from backend.src.scheduler import scrape_events_job, fec_research_job
      async def main():
          await scrape_events_job()
          await fec_research_job()
      asyncio.run(main())
      "
    profiles:
      - scraper
    restart: "no"
